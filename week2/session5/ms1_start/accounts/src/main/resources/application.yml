#spring.main.allow-bean-definition-overriding=true
server:
  port: 8080
spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active:
      - "qa"
  application:
    name: accounts
  jpa:
    show-sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      enabled: true
  info:
    env:
      enabled: true
info:
  message: "welcome to accounts application default profile"
  name: "raj default profile accounts"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/


resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
        max-wait-duration-in-half-open-state: 5s
        #The wait-duration-in-open-state is the amount of time a circuit breaker remains open before switching to a half-open state