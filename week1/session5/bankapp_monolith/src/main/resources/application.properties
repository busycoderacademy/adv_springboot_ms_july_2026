spring.application.name=bankapp
#spring.datasource.url=jdbc:mysql://localhost:3306/foo123
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Custom H2 Console URL
spring.h2.console.path=/h2
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.web: DEBUG
logging.level.org.hibernate: ERROR
logging.level.com.bankapp.service: DEBUG
logging.level.com.bankapp.service.aspect: INFO

#logging.pattern.console= "%d{yyyy-MM-dd } [%thread] %-5level %logger{36} - %msg%n"
#logging.pattern.file= "%d{yyyy-MM-dd } [%thread] %-5level %logger{36} - %msg%n"
#logging.file.name=bankapp.log

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8090
server.servlet.context-path=/bankapp


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

