apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    app: accounts

spec:
  replicas: 1

  selector:
    matchLabels:
      app: accounts

  template:
    metadata:
      labels:
        app: accounts

    spec:
      containers:
        - name: accounts
          image: rgupta00/accounts:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8085

          envFrom:
          - configMapRef:
              name: accounts-config

---
apiVersion: v1
kind: Service
metadata:
  name: accounts

spec:
  type: NodePort

  selector:
    app: accounts

  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30001