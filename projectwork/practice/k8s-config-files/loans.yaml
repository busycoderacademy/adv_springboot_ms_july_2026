apiVersion: apps/v1
kind: Deployment
metadata:
  name: loans

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loans

  template:
    metadata:
      labels:
        app: loans

    spec:
      containers:
      - name: loans
        image: rgupta00/loans:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 8090

---
apiVersion: v1
kind: Service
metadata:
  name: loans

spec:
  type: NodePort

  selector:
    app: loans

  ports:
  - port: 8090
    targetPort: 8090
    nodePort: 30003