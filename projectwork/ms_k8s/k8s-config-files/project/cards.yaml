apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cards

  template:
    metadata:
      labels:
        app: cards

    spec:
      containers:
      - name: cards
        image: rgupta00/cards:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: cards

spec:
  type: NodePort

  selector:
    app: cards

  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30002