apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: productapp-rs
spec:
  replicas: 3
#selector.matchLabels == template.metadata.labels
  selector:
    matchLabels:
      app: productapp-demo

  template:
    metadata:
      labels:
        app: productapp
    spec:
      containers:
      - name: productapp
        image: rgupta00/productapp:1.1

        ports:
        - containerPort: 8090

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=50 -XX:+UseG1GC"

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 15