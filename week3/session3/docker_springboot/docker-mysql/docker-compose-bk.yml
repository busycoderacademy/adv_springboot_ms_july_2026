version: "3.8"
services:
  mysqldb:
    image: mysql:8
    container_name: mysqldb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productdb
      MYSQL_USER: productuser
      MYSQL_PASSWORD: productpass
    ports:
      - "3308:3306"
    networks:
      - product-network

  productappdb:
    build: .
    container_name: productappdb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - mysqldb
    networks:
      - product-network
networks:
  product-network:
    driver: bridge