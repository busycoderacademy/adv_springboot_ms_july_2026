version: "3.8"

services:

  productapp:
    build: ./productapp
    container_name: productapp
    ports:
      - "8080:8080"
    networks:
      - product-network

  productapp-client:
    build: ./productapp-client
    container_name: productapp-client
    ports:
      - "8081:8081"
    depends_on:
      - productapp
    networks:
      - product-network

networks:
  product-network:
    driver: bridge