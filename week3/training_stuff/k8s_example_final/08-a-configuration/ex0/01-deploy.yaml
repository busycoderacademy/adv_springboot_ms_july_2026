apiVersion: apps/v1
kind: Deployment
metadata:
  name: productapp-deploy
  annotations:
    kubernetes.io/change-cause: "deploy productapp v1.1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: productapp
  template:
    metadata:
      labels:
        app: productapp
    spec:
      containers:
      - name: productapp
        image: rgupta00/productapp:1.1

        ports:
        - containerPort: 8090

        env:
        - name: PRODUCT_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: productapp-config
              key: PRODUCT_MESSAGE

        - name: PRODUCT_FEATUREENABLED
          valueFrom:
            configMapKeyRef:
              name: productapp-config
              key: PRODUCT_FEATUREENABLED

        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: productapp-secret
              key: DATABASE_USERNAME

        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: productapp-secret
              key: DATABASE_PASSWORD

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 15